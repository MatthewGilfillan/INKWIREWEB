<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Worksheets | Ink Wire Education</title><link rel="stylesheet" href="accounts.css"><link rel="stylesheet" href="worksheets.css"><script type="module" src="worksheets.js"></script><link rel="icon" href="/favicon.ico?v=20261101" sizes="16x16 32x32 48x48 64x64"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=20261101"><link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png?v=20261101"><link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png?v=20261101"></head>
<body class="worksheet-app"><header class="ws-header"><a href="./" aria-label="Ink Wire Education home"><img src="assets/inkwire-logo.webp" alt="Ink Wire Education" width="640" height="213"></a><a id="dashboard-link" href="account">Back to dashboard</a><span id="preview-label" hidden>Practice preview · sample data</span></header>
<main><section id="worksheet-library" class="ws-library"><div class="ws-heading"><div><p class="eyebrow" id="class-name">YOUR CLASS</p><h1>Worksheets</h1></div><button id="upload-open" class="primary" hidden>+ Add PDF worksheet</button></div><p id="library-status" role="status">Loading worksheets…</p><div id="worksheet-cards" class="ws-cards"></div><button id="library-retry" hidden>Try again</button></section>
<section id="worksheet-workspace" hidden><div class="ws-document-heading"><button id="back-library" class="quiet">← Worksheets</button><div class="ws-title"><h1 id="worksheet-title"></h1><p id="copy-label"></p></div><label id="learner-picker" hidden>Student copy<select id="learner-select"></select></label><span id="save-status" role="status" aria-live="polite"></span><button id="publish-parent" class="primary" hidden>Share with parent</button><button id="print-worksheet">Print / save PDF</button></div>
<div id="workspace-error" class="ws-error" role="alert" hidden></div><div id="read-only-message" class="ws-notice" hidden></div>
<div class="ws-toolbar" role="toolbar" aria-label="Worksheet tools"><div class="tool-group" id="drawing-tools"><button data-tool="select" aria-pressed="true" title="Select and move your annotations">↖ <span>Select</span></button><button data-tool="text" aria-pressed="false">T <span>Text</span></button><button data-tool="pen" aria-pressed="false">✎ <span>Pen</span></button><button data-tool="highlight" aria-pressed="false">▰ <span>Highlight</span></button><button data-tool="erase" aria-pressed="false">⌫ <span>Erase</span></button></div><div class="tool-group" id="style-tools"><label class="color-label">Color<input id="ink-color" type="color" value="#243556"></label><label>Size<select id="ink-size"><option value="1.5">Fine</option><option value="3" selected>Medium</option><option value="6">Thick</option></select></label><label>Text<select id="text-size"><option value="12">12</option><option value="16" selected>16</option><option value="20">20</option><option value="26">26</option></select></label><button id="text-bold" aria-pressed="false" title="Bold text"><b>B</b></button><button id="undo-mark" disabled title="Undo your last change">↶ Undo</button><button id="redo-mark" disabled title="Redo your last change">↷ Redo</button><button id="delete-mark" disabled title="Delete your selected annotation">Delete</button></div><div class="tool-group" id="feedback-tools" hidden><label>Quick feedback<select id="feedback-select"><option value="">Choose feedback…</option><option>⭐ Strong choice of evidence.</option><option>Explain how this supports your point.</option><option>Develop this idea with a specific example.</option><option>Check punctuation and sentence boundaries.</option><option>✓ Target achieved.</option></select></label></div><div class="tool-group zoom-tools"><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit-page">Fit width</button></div></div>
<div class="ws-content"><nav id="page-navigation" aria-label="Worksheet pages"></nav><div id="page-scroll" class="page-scroll"><div id="worksheet-pages"></div></div></div><div class="ws-bottom"><span id="tool-hint">Choose a tool to start.</span><span id="published-label"></span><button id="download-recovery" hidden>Download unsaved work</button></div></section></main>
<dialog id="upload-dialog" aria-labelledby="upload-title"><form id="upload-form"><div class="dialog-heading"><h2 id="upload-title">Add a PDF worksheet</h2><button type="button" id="upload-close" class="quiet" aria-label="Close">×</button></div><label>Worksheet title<input id="upload-name" maxlength="120" required placeholder="e.g. Act II — character analysis"></label><label id="pdf-dropzone" class="pdf-dropzone">Drop your PDF here, or choose a file<input id="pdf-input" type="file" accept="application/pdf,.pdf" required><span id="pdf-file-name">Up to 10 MB · 60 pages</span></label><p>Each page stays locked as the background. Every student gets a separate copy to write and draw on.</p><p id="upload-error" class="ws-error" role="alert" hidden></p><div class="dialog-actions"><button type="button" id="upload-cancel">Cancel</button><button type="submit" class="primary" id="upload-submit">Add worksheet</button></div></form></dialog>
<noscript>Please enable JavaScript to use worksheets.</noscript></body></html>
